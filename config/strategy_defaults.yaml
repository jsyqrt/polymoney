# ============================================================================
# PolyMoney Position Arbitrage Strategy Configuration
# ============================================================================
#
# This file contains all configurable parameters for the position arbitrage
# strategy, simulation runner, and risk controls. Values here serve as defaults
# and can be overridden via CLI arguments.
#
# Usage:
#   python scripts/run_trading.py --config config/strategy_defaults.yaml
#   python scripts/run_trading.py backtest --config config/my_custom.yaml
#
# ============================================================================

# ---------------------------------------------------------------------------
# Strategy Core Parameters
# ---------------------------------------------------------------------------
strategy:
  # Target cost rate: UP_limit + DOWN_limit should sum to this value.
  # Must be < 1.0 for guaranteed profit.
  # Reduced from 0.98 → 0.96 to provide 4% margin for fill asymmetry.
  # With 2% margin (0.98), just 1 extra fill on one side pushes ECR > 1.0.
  # With 4% margin (0.96), can absorb 2 extra asymmetric fills.
  target_cost: 0.96

  # Batch ratio: order size as fraction of position_size.
  # batch_size = position_size × batch_ratio (auto-calculated).
  # Default 0.001 (1/1000): for $100 budget → $0.10 per order.
  # Very small batches give fine-grained averaging and precise ECR convergence.
  # NOTE: In live trading, the per-side min_order_cost (min_order_shares × side_price)
  # dominates when batch_size is small. E.g. at price $0.50, min cost = 5×0.50 = $2.50,
  # so effective order size is $2.50 regardless of batch_size=$0.10.
  # For faster position building in live trading, consider --batch-ratio 0.025.
  batch_ratio: 0.001

  # Explicit batch_size override (uncomment to disable auto-calculation):
  # batch_size: 1.0

  # Minimum order size in shares.
  # Polymarket CLOB enforces a per-market minimum (typically 5-15 shares).
  # Default 5 matches the common floor. At $0.50/share, this means $2.50 minimum.
  min_order_shares: 5

  # Maximum position size per market in USD.
  position_size: 100.0

  # Order timeout in seconds before auto-cancel.
  order_timeout: 60

  # Phase boundaries (seconds from market start):
  #   Phase 1 (0 → phase1_end): Aggressive position building
  #   Phase 2 (phase1_end → phase2_end): Steady optimization
  #   Phase 3 (phase2_end → end): Close-out, focus on lagging side
  phase1_end: 300
  phase2_end: 600

  # Don't buy tokens below this price (avoid nearly-decided markets).
  low_prob_threshold: 0.05

  # Maximum orders per price tick.
  # Reduced from 4 to 2: fewer orders per tick means less waste from stale orders.
  max_orders_per_tick: 2

  # Adaptive target_cost: dynamically adjusts discount based on orderbook spread.
  # High liquidity (tight spread) → smaller discount (higher target).
  # Low liquidity (wide spread) → larger discount (lower target).
  enable_adaptive_target: true
  adaptive_target_min: 0.94   # Floor for wide-spread (illiquid) markets
  adaptive_target_max: 0.955  # Ceiling for tight-spread (liquid) markets
  
  # Minimum maker discount: limit price must be at least this % below market.
  # Increased from 1.5% to 3% to improve fill rate in live trading.
  # Higher value = closer to market price = more fills but lower margin.
  min_maker_discount: 0.03
  
  # Fill urgency mode: when true, use aggressive limit pricing (closer to market)
  # to improve fill rate at the cost of lower profit margin.
  fill_urgency_mode: true

# ---------------------------------------------------------------------------
# Risk Control Parameters
# ---------------------------------------------------------------------------
risk:
  # ECR stop-loss threshold. Orders are blocked when ECR >= this value.
  ecr_threshold: 1.05

  # Position balance warning threshold (min/max ratio).
  balance_threshold: 0.70

  # Enable/disable ECR stop-loss mechanism.
  enable_ecr_stoploss: true

  # Enable/disable rebalancing for severe imbalance.
  # When triggered, places an aggressive limit order (0.2% below market)
  # on the underweight side.  Uses maker pricing (0% fee).
  enable_rebalancing: true

  # Cooldown between rebalancing orders (seconds).
  rebalancing_cooldown: 30

  # Balance ratio to trigger rebalancing.
  severe_imbalance_threshold: 0.50

  # Maximum rebalancing order size as fraction of total position cost.
  market_order_size_cap: 0.10

  # Market skew filter: if max(up_price, down_price) exceeds this threshold,
  # new limit orders are suspended to prevent one-sided position building.
  # In extremely skewed markets, only the cheap side fills, creating unhedged risk.
  max_skew_threshold: 0.85

  # Trend patience threshold: when max(up, down) exceeds this but is below
  # max_skew_threshold, enter "trend patience" mode — asymmetric pricing and
  # cheap-side blocking to prevent one-sided fill accumulation.
  # Lowered from 0.65 → 0.57 to activate protection earlier.
  trend_patience_threshold: 0.57


# ---------------------------------------------------------------------------
# Hard Stop-Loss (Abandon) Parameters
# ---------------------------------------------------------------------------
stop_loss:
  # Realized ECR above this threshold triggers abandon evaluation.
  abandon_ecr_threshold: 1.02

  # Balance ratio below this threshold (with ECR > threshold) triggers abandon.
  abandon_balance_threshold: 0.30

  # Market must be past this fraction of duration before abandon activates.
  abandon_time_threshold: 0.50

  # Early abandon for extreme one-sided positions.
  # When ECR is very high with near-zero balance, stop wasting capital earlier.
  early_abandon_ecr_threshold: 3.0
  early_abandon_balance_threshold: 0.10
  early_abandon_time_threshold: 0.30

# ---------------------------------------------------------------------------
# Trend Detection Parameters
# ---------------------------------------------------------------------------
trend_detection:
  # Enable/disable trend detection filter.
  enabled: true

  # Time window in seconds for momentum calculation.
  momentum_window_seconds: 30.0

  # Momentum value at which confidence reaches 100%.
  max_momentum_threshold: 0.10

  # Confidence level to stop placing orders on losing side.
  trend_stop_threshold: 0.70

# ---------------------------------------------------------------------------
# Urgency Pricing Parameters
# ---------------------------------------------------------------------------
urgency_pricing:
  # Enable/disable urgency-based dynamic limit pricing.
  enabled: true

  # Weight for imbalance vs time urgency (higher = more aggressive).
  urgency_weight: 1.5

  # Maximum offset reduction factor from urgency adjustments.
  # Reduced from 0.50 → 0.25: at 0.50, limits were pushed so close to market
  # that even minor fill asymmetry caused ECR > 1.0.  At 0.25, limits stay
  # further from market, preserving the discount margin needed for profitability.
  urgency_price_factor: 0.25

  # Default market duration in seconds (fallback if settlement time unknown).
  market_duration: 900

# ---------------------------------------------------------------------------
# Simulation Parameters
# ---------------------------------------------------------------------------
simulation:
  # Coins to monitor for live simulation.
  coins:
    - btc
    - eth
    - sol

  # Runtime duration in seconds (0 = infinite).
  duration_seconds: 0

  # Output directory for results.
  output_dir: simulation_results

  # Market scan interval (seconds) - how often to poll for new markets.
  market_scan_interval: 60.0

  # Metrics output interval (seconds) - how often to log metrics.
  metrics_output_interval: 1.0

  # Cancel pending orders after this many seconds.
  order_timeout: 30.0

  # Cancel orders when market price moves this far from limit (fraction).
  # 20%: binary markets swing 10%+/s, tight thresholds cause cancel-replace cycles.
  stale_order_threshold: 0.20

  # Minimum trading time remaining (seconds) to enter a market.
  min_trading_time: 300.0

  # Minimum token price to consider market tradeable.
  min_price_threshold: 0.05

  # Maximum entry skew: skip markets where max(up, down) exceeds this at entry.
  # Reduced from 85% to 70%: data shows markets entered at >70% skew produce
  # mostly one-sided positions with avg -$2.52/loss. The trend-adaptive pricing
  # cannot overcome the fill asymmetry in already-skewed markets.
  max_entry_skew: 0.70

# ---------------------------------------------------------------------------
# Multi-Timeframe Support
# ---------------------------------------------------------------------------
# Per-timeframe parameter overrides. The runner detects timeframe from slug
# and applies corresponding profile.  Keys not present fall through to the
# base strategy/simulation values above.
timeframes:
  15m:
    phase1_end: 300
    phase2_end: 600
    market_duration: 900
    order_timeout: 30
    batch_ratio: 0.001
    min_trading_time: 300
    stale_order_threshold: 0.20
  1h:
    phase1_end: 1200
    phase2_end: 2400
    market_duration: 3600
    order_timeout: 60
    batch_ratio: 0.0005
    min_trading_time: 600
    stale_order_threshold: 0.20
  4h:
    phase1_end: 3600
    phase2_end: 10800
    market_duration: 14400
    order_timeout: 120
    batch_ratio: 0.0003
    min_trading_time: 1800
    stale_order_threshold: 0.20

# ---------------------------------------------------------------------------
# Global Fund Management
# ---------------------------------------------------------------------------
fund_management:
  # Maximum number of markets trading simultaneously.
  max_concurrent_markets: 6

  # Maximum total cost exposure across all active markets (USD).
  max_total_exposure: 500.0

  # Redemption delay in seconds (paper mode only).
  # Models the real-world latency between settlement detection and USDC availability:
  #   settlement → Data API reflects → redeem tx confirms → USDC credited.
  # During this window, capital is locked and NOT available for new positions.
  # 0 = instant (unrealistic), 60 = typical real-world latency.
  # Live mode ignores this — PositionRedeemer handles real redemption.
  redemption_delay: 60.0

# ---------------------------------------------------------------------------
# Strategy Version
# ---------------------------------------------------------------------------
# "v1" = Original maker-only strategy (position_arbitrage.py)
# "v2" = Taker-hybrid strategy (position_arbitrage_v2.py)
#        Uses taker orders to complete hedges, scratch trades to exit flat.
#        See docs/strategy-first-principles.md for design rationale.
strategy_version: v1

# ---------------------------------------------------------------------------
# V2 Strategy Parameters (only used when strategy_version: v2)
# ---------------------------------------------------------------------------
strategy_v2:
  # Maximum pair cost for taker completion.
  # After one side fills as maker, the other side can be bought as taker
  # if the combined pair cost < this threshold. Must be < 1.0 for profit.
  max_taker_pair_cost: 0.995

  # Seconds to wait for a maker fill before scratching (selling back).
  maker_window_seconds: 30.0

  # Maximum acceptable scratch loss as fraction of position cost.
  max_scratch_loss_pct: 0.05

  # Price buffer above market for taker orders (ensures fill).
  taker_slippage_buffer: 0.005

  # Minimum maker discount for V2 (tighter than V1 since taker is backup).
  min_maker_discount: 0.015
